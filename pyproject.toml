[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etch-sketch"
version = "0.2.0"
description = "Etch-A-Sketch for AI: deterministic vector composition for agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp==1.30.0",
    "cairosvg==2.9.1",
    "Pillow==12.3.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.scripts]
etch-mcp = "engine.mcp_server:main"

[project.urls]
Homepage = "https://github.com/grafkendo/sketchai"
Repository = "https://github.com/grafkendo/sketchai"

[tool.setuptools]
packages = ["engine"]
# Explicit: only the package's own data files travel. The engine/.venv,
# demo_out PNGs, and runtime assets/ stay local and are never installed.
include-package-data = false

[tool.setuptools.package-data]
engine = ["fonts/*.ttf", "brands/*.json"]
