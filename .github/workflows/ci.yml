# CI for Etch. First ran 2026-11-10 (run #1): Ubuntu leg green; the Windows
# GTK3-runtime step hung on Start-Process -Wait (installer child processes)
# and was rewritten to launch-and-poll for libcairo-2.dll instead.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GTK3 runtime (Windows, for cairosvg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # cairosvg needs libcairo-2.dll, which pip cannot ship on Windows.
          # render.py auto-registers the GTK bin dir at import, so we only
          # need the runtime present on disk.
          $asset = (Invoke-RestMethod `
            https://api.github.com/repos/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/latest).assets `
            | Where-Object { $_.name -like '*win64.exe' } | Select-Object -First 1
          Write-Host "Installing $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\gtk3.exe"
          # Do NOT -Wait on the installer: it spawns child processes and
          # Start-Process -Wait hangs on them on GitHub runners (observed
          # 2026-11-10, first CI run stalled >15 min at this step). Launch
          # it, then poll for the file render.py actually needs.
          Start-Process "$env:RUNNER_TEMP\gtk3.exe" -ArgumentList '/S'
          $dll = "C:\Program Files\GTK3-Runtime Win64\bin\libcairo-2.dll"
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $dll) { Write-Host "libcairo-2.dll present"; break }
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $dll)) { throw "GTK3 runtime install did not produce libcairo-2.dll within 5 minutes" }

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Determinism tests
        working-directory: engine
        run: python test_determinism.py

      - name: MCP tool tests
        working-directory: engine
        run: python test_mcp.py
